# README screenshots, taken on a virtual display with network access (run by hand).
name: Screenshots

on:
  workflow_dispatch:

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-x11-0 xvfb xdotool imagemagick cmake
      - run: cargo build --release -p oktospace
      - run: ci/screenshots.sh
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: screenshots
