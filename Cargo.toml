[workspace]
resolver = "2"
members = ["crates/oktospace-core", "crates/oktospace", "crates/oktospace-cli"]

[workspace.package]
version = "0.4.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/emircesur/OktoSpace"
rust-version = "1.85"

[workspace.dependencies]
oktospace-core = { path = "crates/oktospace-core" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = { version = "1", features = ["serde"] }
log = "0.4"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
